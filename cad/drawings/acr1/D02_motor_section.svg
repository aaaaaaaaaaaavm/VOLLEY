<text x="75" y="912" font-size="17" fill="#172631" font-weight="400">Active magnet X relative to carrier aft: 76 to 412 (336 active; 340 mounting envelope).</text>
<text x="75" y="940" font-size="17" fill="#172631" font-weight="400">Home active X: 276 to 612. Release active X: 1576 to 1912.</text>
<text x="75" y="968" font-size="17" fill="#172631" font-weight="400">216 stator belts at 8 pitch: X 230 to 1958; end allowance 46 at home/release.</text>
<text x="75" y="996" font-size="17" fill="#172631" font-weight="400">Payload floor Z = 46. Carrier top plate Z = 14 to 30; bottom plate Z = -30 to -14.</text>
