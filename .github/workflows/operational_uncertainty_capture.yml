name: operational uncertainty capture

on:
  push:
    paths:
      - analysis/operational_uncertainty.py
      - validation/P113_S5_operational_uncertainty.md
      - tests/test_operational_uncertainty.py
      - .github/workflows/operational_uncertainty_capture.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: fetch
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q origin main
          git checkout -q -B main origin/main
      - name: install
        run: |
          python3 -m pip install --upgrade -q pip
          python3 -m pip install -q -r requirements.txt -r requirements-dev.txt
      - name: generate
        run: python3 analysis/operational_uncertainty.py
      - name: focused checks
        run: python3 -m pytest tests/test_operational_uncertainty.py -q
      - name: publish generated evidence
        run: |
          git config user.name "Adityavardhan Mishra"
          git config user.email "adityavardhanmishr@gmail.com"
          git add analysis/results/operational_uncertainty.json docs/OPERATIONAL_UNCERTAINTY.md figures/operational_uncertainty.svg
          git diff --cached --exit-code && exit 0
          git commit -m "Record P113-S5 operational uncertainty evidence"
          git push origin HEAD:main
