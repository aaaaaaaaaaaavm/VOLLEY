# The gates, on every push. Nothing here reaches the network for evidence and nothing here is
# optional: each of these caught a real defect in this repository before it was written down.
#
# WHY THERE IS NO `uses:` ANYWHERE IN THIS FILE
# ---------------------------------------------
# Every run of this workflow between 2026-08-22 and 2026-08-26 ended in `startup_failure` with
# zero jobs, and the reason is not in the file. This repository's Actions settings do not permit
# third-party actions, so any workflow referencing `actions/checkout` is refused before a job is
# dispatched. Demonstrated on 2026-08-26 by running five workflows on one branch: four that use
# `actions/checkout@v4`, including one byte-identical in shape to the workflow that succeeds in a
# sibling repository, all failed at startup; a workflow referencing no action at all succeeded in
# eight seconds.
#
# So the repository is fetched with git and Python is used as the runner ships it. If the owner
# later allows `actions/*` under Settings, Actions, General, Actions permissions, this can go back
# to `actions/checkout@v4` with `fetch-depth: 0`. Until then, do not reintroduce a `uses:` line:
# it will silently take CI back to red.
name: gates

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: offline gates
    runs-on: ubuntu-latest
    steps:
      - name: fetch the repository
        # Full history, not a shallow clone: check_companions asks git what has changed since
        # the recorded export commit.
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --prune origin +refs/heads/*:refs/remotes/origin/*
          git checkout -q --detach "${{ github.sha }}"
          git log --oneline -1

      - name: install
        run: |
          python3 -m pip install --upgrade -q pip
          python3 -m pip install -q -r requirements.txt -r requirements-dev.txt

      - name: links
        run: python3 tools/check_links.py
      - name: register
        run: python3 tools/register_status.py --check
      - name: baseline
        run: python3 tools/make_baseline.py --check
      - name: public surfaces
        run: python3 tools/check_public.py
      - name: cross-references
        run: python3 tools/check_crossrefs.py
      - name: companion payloads
        run: python3 tools/check_companions.py
      - name: band integrity
        run: python3 tools/check_bands.py
      - name: results freshness
        run: python3 tools/check_results_fresh.py
      - name: computational closure
        run: python3 tools/check_computational_closure.py
      - name: host-reference blocks
        run: python3 analysis/host_reference.py --check-doc
      - name: host-reference self-test
        run: python3 analysis/host_reference.py --self-test

      - name: properties and regressions
        run: python3 -m pytest

      # host_reference.py is deliberately NOT re-run here. check_results_fresh.py above
      # already regenerates analysis/results/host_reference.json and compares it
      # numerically, with a declared tolerance and a reason. Re-running it a second time
      # and demanding byte identity asserts a property this repository has already
      # established two machines cannot share: the transfer-arc sums differ in the last
      # bit because pow and division are not required to be correctly rounded, and the
      # same 1-ulp disagreement that failed run 45 is what P115 and the freshness gate
      # exist to handle properly. The generators below emit integers and formatted text,
      # where byte identity IS achievable, so they stay.
      - name: nothing generated drifted
        run: |
          python3 analysis/payload_family.py > /dev/null
          python3 analysis/cell_manifest.py > /dev/null
          python3 tools/register_status.py > /dev/null
          git diff --exit-code

  solvers:
    name: solver-backed validation
    runs-on: ubuntu-latest
    # The heavy half. gmsh, CalculiX, ngspice and CadQuery are not needed to check that the
    # record is consistent, only to reproduce the runs behind it, so they are separated rather
    # than paid for on every push.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: fetch the repository
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --prune origin +refs/heads/*:refs/remotes/origin/*
          git checkout -q --detach "${{ github.sha }}"
      - name: system solvers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq calculix-ccx ngspice
      - name: python solvers
        run: |
          python3 -m pip install --upgrade -q pip
          python3 -m pip install -q -r requirements.txt
          python3 -m pip install -q gmsh scikit-fem cadquery CoolProp SALib
      - name: CAD against parameters
        run: |
          python3 cad/build_gen5.py --check
          python3 cad/build_gen6.py --check
      - name: artifacts
        run: python3 tools/check_artifacts.py
