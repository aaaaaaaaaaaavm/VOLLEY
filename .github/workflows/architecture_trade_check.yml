name: architecture-trade-check

on:
  push:
    branches: [gen6-architecture-trade]
    paths: [.github/workflows/architecture_trade_check.yml]

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: fetch repository
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q origin "${{ github.sha }}"
          git checkout -q --detach "${{ github.sha }}"
      - name: regenerate exact artifacts
        run: python3 analysis/gen6_architecture_trade.py
      - name: publish normalized artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          paths = ['analysis/results/gen6_architecture_trade.json', 'docs/GEN6_ARCHITECTURE_TRADE.md', 'figures/gen6_architecture_trade.svg']
          headers = {'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28'}
          for path in paths:
              url = f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}?ref={os.environ['BRANCH']}"
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
                  sha = json.load(response)['sha']
              content = base64.b64encode(open(path,'rb').read()).decode('ascii')
              payload = json.dumps({'message':'Normalize P92 generated evidence','content':content,'sha':sha,'branch':os.environ['BRANCH'],'author':{'name':'Adityavardhan Mishra','email':'adityavardhanmishr@gmail.com'},'committer':{'name':'Adityavardhan Mishra','email':'adityavardhanmishr@gmail.com'}}).encode()
              req = urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}", data=payload, method='PUT', headers={**headers,'Content-Type':'application/json'})
              with urllib.request.urlopen(req) as response:
                  if response.status not in (200,201): raise RuntimeError(f'{path}: {response.status}')
          PY
