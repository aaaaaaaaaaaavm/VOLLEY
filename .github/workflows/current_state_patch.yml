name: current state text patch

on:
  push:
    paths:
      - .github/workflows/current_state_patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: fetch
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q origin main
          git checkout -q -B main origin/main
      - name: patch
        run: python3 tools/current_state_patch.py
      - name: publish
        run: |
          git config user.name "Adityavardhan Mishra"
          git config user.email "adityavardhanmishr@gmail.com"
          git add tools/export_companion.py tools/profile-readme/README.md
          git diff --cached --check
          git commit -m "Reconcile generated summaries with current Gen6 reference"
          git push origin HEAD:main
