name: manifest-capture

on:
  push:
    branches:
      - mission-manifest-completion-20260915
    paths:
      - .github/workflows/manifest_capture.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: fetch repository
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q origin "${{ github.sha }}"
          git checkout -q --detach "${{ github.sha }}"
      - name: install
        run: |
          python3 -m pip install --upgrade -q pip
          python3 -m pip install -q -r requirements.txt -r requirements-dev.txt
      - name: generate and verify
        run: |
          python3 analysis/manifest_timing.py
          python3 -m pytest tests/test_manifest_timing.py -q
      - name: publish generated evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          paths = [
              'analysis/results/manifest_timing.json',
              'docs/MANIFEST_TIMING.md',
              'figures/manifest_timing.svg',
          ]
          for path in paths:
              with open(path, 'rb') as fh:
                  content = base64.b64encode(fh.read()).decode('ascii')
              payload = json.dumps({
                  'message': 'Publish P113-S4 generated evidence',
                  'content': content,
                  'branch': os.environ['BRANCH'],
                  'author': {'name': 'Adityavardhan Mishra', 'email': 'adityavardhanmishr@gmail.com'},
                  'committer': {'name': 'Adityavardhan Mishra', 'email': 'adityavardhanmishr@gmail.com'},
              }).encode('utf-8')
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPO']}/contents/{path}",
                  data=payload,
                  method='PUT',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  if response.status not in (200, 201):
                      raise RuntimeError(f'{path}: HTTP {response.status}')
          PY
