name: manifest-capture

on:
  push:
    branches:
      - mission-manifest-completion-20260915
    paths:
      - .github/workflows/manifest_capture.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: fetch repository
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q origin "${{ github.sha }}"
          git checkout -q --detach "${{ github.sha }}"
      - name: install
        run: |
          python3 -m pip install --upgrade -q pip
          python3 -m pip install -q -r requirements.txt -r requirements-dev.txt
      - name: generate and verify
        run: |
          python3 analysis/manifest_timing.py
          python3 -m pytest tests/test_manifest_timing.py -q
      - name: publish generated evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          for path in analysis/results/manifest_timing.json docs/MANIFEST_TIMING.md figures/manifest_timing.svg; do
            content=$(base64 -w0 "$path")
            jq -n --arg message "Publish P113-S4 generated evidence" --arg content "$content" --arg branch "$BRANCH" \
              --arg name "Adityavardhan Mishra" --arg email "adityavardhanmishr@gmail.com" \
              '{message:$message,content:$content,branch:$branch,author:{name:$name,email:$email},committer:{name:$name,email:$email}}' > /tmp/payload.json
            curl -fsSL -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/contents/$path" \
              --data-binary @/tmp/payload.json >/dev/null
          done
