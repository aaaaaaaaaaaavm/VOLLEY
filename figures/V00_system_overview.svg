<text x="72" y="78" fill="#38d6e8" font-family="Inter,Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="start">VOLLEY · THE FLAGSHIP ENGINEERING RECORD</text>
<text x="72" y="124" fill="#e8f0f7" font-family="Inter,Segoe UI,sans-serif" font-size="35" font-weight="650" text-anchor="start">Command the release condition. Keep the spacecraft unmodified.</text>
<text x="72" y="162" fill="#8fa7ba" font-family="Inter,Segoe UI,sans-serif" font-size="19" font-weight="400" text-anchor="start">One mission, two architectures, and the evidence boundary between them.</text>
