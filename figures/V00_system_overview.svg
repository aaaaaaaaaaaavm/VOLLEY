<text x="1244" y="302" fill="#e8f0f7" font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="650" text-anchor="start">orbital energy changes</text>
<rect x="72" y="400" width="708" height="278" rx="18" fill="#0c1d2a" stroke="#38d6e8"/>
<text x="102" y="448" fill="#38d6e8" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" text-anchor="start">GEN5 · FROZEN BASELINE</text>
<text x="102" y="498" fill="#38d6e8" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="start">•</text>
<text x="130" y="498" fill="#e8f0f7" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="500" text-anchor="start">self-contained Halbach LSM · 1.3 m acceleration</text>
<text x="102" y="541" fill="#38d6e8" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="start">•</text>
<text x="130" y="541" fill="#e8f0f7" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="500" text-anchor="start">16.029 m/s · 10.068 g · 162.3 ms</text>
<text x="102" y="584" fill="#38d6e8" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="start">•</text>
<text x="130" y="584" fill="#e8f0f7" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="500" text-anchor="start">2.782 kJ gross · 100.0% energy closure</text>
<text x="102" y="627" fill="#38d6e8" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="start">•</text>
<text x="130" y="627" fill="#8fa7ba" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="500" text-anchor="start">structural FEA · CFD · control design · second CAD implementation</text>
<rect x="816" y="400" width="708" height="278" rx="18" fill="#0c1d2a" stroke="#ffb454"/>
<text x="846" y="448" fill="#ffb454" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" text-anchor="start">GEN6 · CURRENT DESIGN TARGET</text>
<text x="846" y="498" fill="#ffb454" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="start">•</text>
<text x="874" y="498" fill="#e8f0f7" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="500" text-anchor="start">stage-integrated cold gas · 8.0 m host-stage rail</text>
<text x="846" y="541" fill="#ffb454" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="start">•</text>
<text x="874" y="541" fill="#e8f0f7" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="500" text-anchor="start">payload accelerated directly; duplicated machinery deleted</text>
<text x="846" y="584" fill="#ffb454" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="start">•</text>
<text x="874" y="584" fill="#e8f0f7" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="500" text-anchor="start">trim stator suspended pending the seal result</text>
<text x="846" y="627" fill="#ffb454" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="start">•</text>
<text x="874" y="627" fill="#8fa7ba" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="500" text-anchor="start">does not inherit Gen5 evidence; contact and provider interfaces remain open</text>
