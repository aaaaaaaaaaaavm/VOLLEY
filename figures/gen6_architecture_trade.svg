<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 520" role="img" aria-label="Gen6 architecture trade summary"><rect width="1500" height="520" rx="24" fill="#0b1220"/><g font-family="Inter,Segoe UI,sans-serif"><text x="55" y="58" fill="#eaf2ff" font-size="25" font-weight="700">GEN6 STARTS FROM MISSION DUTY, NOT MAXIMUM RELEASE SPEED</text><text x="55" y="88" fill="#91a5bd" font-size="15">4 kg reference payload · bar length = payload kinetic energy · stroke shown at 10 g</text><text x="70" y="150" fill="#eaf2ff" font-size="15">s4_best_tested_first_release</text><rect x="410" y="132" width="16.1" height="24" rx="6" fill="#3fd1c5"/><text x="441.1" y="150" fill="#91a5bd" font-size="13">41.8 J · 0.106 m @ 10 g</text><text x="70" y="208" fill="#eaf2ff" font-size="15">bolley_reference</text><rect x="410" y="190" width="107.6" height="24" rx="6" fill="#65adff"/><text x="532.6" y="208" fill="#91a5bd" font-size="13">278.5 J · 0.710 m @ 10 g</text><text x="70" y="266" fill="#eaf2ff" font-size="15">gen5_reference</text><rect x="410" y="248" width="198.5" height="24" rx="6" fill="#9b8cff"/><text x="623.5" y="266" fill="#91a5bd" font-size="13">513.9 J · 1.310 m @ 10 g</text><text x="70" y="324" fill="#eaf2ff" font-size="15">gen6_reference</text><rect x="410" y="306" width="650.0" height="24" rx="6" fill="#f2b65c"/><text x="1075.0" y="324" fill="#91a5bd" font-size="13">1683.0 J · 4.291 m @ 10 g</text><g transform="translate(70 400)"><rect width="1360" height="82" rx="14" fill="#101b2b" stroke="#25374c"/><text x="24" y="31" fill="#f2b65c" font-size="13" font-weight="700">P92: OPEN / UNDERDETERMINED</text><text x="24" y="57" fill="#eaf2ff" font-size="15">The low S4 duty makes a compact release cell worth sizing. Installed mass, retention/arrest, clearing time and fault isolation decide what wins.</text></g></g></svg>