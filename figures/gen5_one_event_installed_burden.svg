<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">One-event installed device and resized-fuel comparison</title>
<desc id="desc">Spring class is 72 kilograms of device plus 4.659 kilograms of one-event fuel. Gen5 is 126.562 kilograms of device plus 2.815 kilograms of one-event fuel. Gen5 has a 52.717 kilogram higher device-plus-fuel proxy. This is a reference algebra screen, not a twelve-release mission or motor rating.</desc>
