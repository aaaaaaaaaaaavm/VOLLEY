<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 420" role="img" aria-label="Release scaling laws"><rect width="1500" height="420" rx="24" fill="#0b1220"/><g font-family="Inter,Segoe UI,sans-serif"><text x="55" y="58" fill="#eaf2ff" font-size="25" font-weight="700">WHY “MORE RELEASE SPEED” GETS EXPENSIVE QUICKLY</text><text x="55" y="88" fill="#91a5bd" font-size="15">These are scaling laws, not a selected mechanism requirement.</text></g><g transform="translate(65 140)" font-family="Inter,Segoe UI,sans-serif"><rect width="410" height="210" rx="18" fill="#111c2c" stroke="#33455c"/><text x="28" y="45" fill="#3fd1c5" font-size="13" font-weight="700">ENERGY</text><text x="28" y="108" fill="#fff" font-size="44" font-family="ui-monospace,monospace">E = ½mv²</text><text x="28" y="156" fill="#91a5bd" font-size="15">Double velocity → four times kinetic energy.</text><text x="28" y="180" fill="#91a5bd" font-size="15">Double payload mass → twice the energy.</text><g transform="translate(445)"><rect width="410" height="210" rx="18" fill="#111c2c" stroke="#33455c"/><text x="28" y="45" fill="#65adff" font-size="13" font-weight="700">STROKE AT FIXED ACCELERATION</text><text x="28" y="108" fill="#fff" font-size="42" font-family="ui-monospace,monospace">L = v² / 2a</text><text x="28" y="156" fill="#91a5bd" font-size="15">Double velocity → four times stroke</text><text x="28" y="180" fill="#91a5bd" font-size="15">unless acceleration also rises.</text></g><g transform="translate(890)"><rect width="410" height="210" rx="18" fill="#111c2c" stroke="#33455c"/><text x="28" y="45" fill="#f2b65c" font-size="13" font-weight="700">DESIGN CONSEQUENCE</text><text x="28" y="92" fill="#fff" font-size="21" font-weight="650">Mission value sets authority.</text><text x="28" y="132" fill="#91a5bd" font-size="15">Velocity is not a score to maximize.</text><text x="28" y="156" fill="#91a5bd" font-size="15">Timing, direction, host manoeuvres and</text><text x="28" y="180" fill="#91a5bd" font-size="15">conventional deployment stay in the trade.</text></g></g></svg>