<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 360" role="img" aria-label="VOLLEY mission sequence">
<rect width="1500" height="360" rx="24" fill="#0b1220"/>
<g font-family="Inter,Segoe UI,sans-serif"><text x="55" y="54" fill="#eaf2ff" font-size="25" font-weight="700">ONE MANIFEST, A SEQUENCE OF CONTROLLED DEPARTURES</text><text x="55" y="82" fill="#91a5bd" font-size="15">The host state, retained mass, recoil and reserves change after every release.</text></g>
<path d="M130 188H1370" stroke="#2b3b50" stroke-width="4"/><g fill="#0b1220" stroke="#58a6ff" stroke-width="4"><circle cx="150" cy="188" r="16"/><circle cx="450" cy="188" r="16"/><circle cx="750" cy="188" r="16"/><circle cx="1050" cy="188" r="16"/><circle cx="1350" cy="188" r="16"/></g>
<g font-family="Inter,Segoe UI,sans-serif" text-anchor="middle"><g fill="#eaf2ff" font-size="17" font-weight="650"><text x="150" y="135">1 · host ready</text><text x="450" y="135">2 · establish geometry</text><text x="750" y="135">3 · release payload</text><text x="1050" y="135">4 · recover host</text><text x="1350" y="135">5 · repeat / dispose</text></g><g fill="#91a5bd" font-size="14"><text x="150" y="238">state + manifest</text><text x="150" y="258">+ reserve declared</text><text x="450" y="238">timing / attitude</text><text x="450" y="258">host manoeuvre if useful</text><text x="750" y="238">relative Δv</text><text x="750" y="258">direction + tip-off</text><text x="1050" y="238">recoil + mass change</text><text x="1050" y="258">resources re-accounted</text><text x="1350" y="238">next target from</text><text x="1350" y="258">the new host state</text></g></g>
<g transform="translate(718 290)"><rect x="0" y="0" width="64" height="18" rx="5" fill="#dce8f7"/><path d="M70 9h55" stroke="#3fd1c5" stroke-width="3"/><circle cx="132" cy="9" r="7" fill="#3fd1c5"/></g>
</svg>