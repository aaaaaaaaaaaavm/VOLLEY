<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-label="Selected VOLLEY findings that changed the design">
<rect width="1500" height="500" rx="24" fill="#0b1220"/><g font-family="Inter,Segoe UI,sans-serif"><text x="55" y="58" fill="#eaf2ff" font-size="25" font-weight="700">THE PROJECT MOVES WHEN A CLAIM BREAKS</text><text x="55" y="88" fill="#91a5bd" font-size="15">Selected findings that changed the architecture or the claims. The complete record stays in the run sheets and problem register.</text></g>
<g transform="translate(55 140)" font-family="Inter,Segoe UI,sans-serif"><g transform="translate(0)"><rect width="325" height="280" rx="18" fill="#111c2c" stroke="#33455c"/><text x="24" y="42" fill="#ff7b72" font-size="13" font-weight="700">GEN5 · MASS</text><text x="24" y="82" fill="#fff" font-size="20" font-weight="650">The dispenser comparison failed.</text><text x="24" y="120" fill="#91a5bd" font-size="14">126.6 kg dry at the frozen</text><text x="24" y="143" fill="#91a5bd" font-size="14">reference point. The baseline</text><text x="24" y="166" fill="#91a5bd" font-size="14">survives as a comparator, not</text><text x="24" y="189" fill="#91a5bd" font-size="14">as a mass-success story.</text></g>
<g transform="translate(350)"><rect width="325" height="280" rx="18" fill="#111c2c" stroke="#33455c"/><text x="24" y="42" fill="#f2b65c" font-size="13" font-weight="700">MISSION · PHASING</text><text x="24" y="82" fill="#fff" font-size="20" font-weight="650">The unique advantage went away.</text><text x="24" y="120" fill="#91a5bd" font-size="14">Release timing can reproduce</text><text x="24" y="143" fill="#91a5bd" font-size="14">part of what extra release speed</text><text x="24" y="166" fill="#91a5bd" font-size="14">was being credited for. The old</text><text x="24" y="189" fill="#91a5bd" font-size="14">claim was withdrawn.</text></g>
<g transform="translate(700)"><rect width="325" height="280" rx="18" fill="#111c2c" stroke="#33455c"/><text x="24" y="42" fill="#ff7b72" font-size="13" font-weight="700">GAS GUIDE · CONTACT</text><text x="24" y="82" fill="#fff" font-size="20" font-weight="650">Geometry exposed model defects.</text><text x="24" y="120" fill="#91a5bd" font-size="14">Contact, release and convergence</text><text x="24" y="143" fill="#91a5bd" font-size="14">remain unresolved. A long guide</text><text x="24" y="166" fill="#91a5bd" font-size="14">is retained as a comparator, not</text><text x="24" y="189" fill="#91a5bd" font-size="14">quietly promoted to baseline.</text></g>
<g transform="translate(1050)"><rect width="325" height="280" rx="18" fill="#111c2c" stroke="#33455c"/><text x="24" y="42" fill="#f2b65c" font-size="13" font-weight="700">TRIM · SUSPENDED</text><text x="24" y="82" fill="#fff" font-size="20" font-weight="650">The proposed trim path failed.</text><text x="24" y="120" fill="#91a5bd" font-size="14">The conducting-tube / magnetic</text><text x="24" y="143" fill="#91a5bd" font-size="14">combination did not survive its</text><text x="24" y="166" fill="#91a5bd" font-size="14">own checks. The clean-sheet</text><text x="24" y="189" fill="#91a5bd" font-size="14">mechanism selection stays open.</text></g></g>
</svg>