<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 520" role="img" aria-label="Shared magazine versus independent bay fault exposure"><rect width="1500" height="520" rx="24" fill="#0b1220"/><g font-family="Inter,Segoe UI,sans-serif"><text x="55" y="58" fill="#eaf2ff" font-size="25" font-weight="700">ARRANGEMENT IS A FAILURE-EXPOSURE DECISION</text><text x="55" y="88" fill="#91a5bd" font-size="15">Independent bays are a leading arrangement hypothesis, not a selected Gen6 mechanism.</text></g><g transform="translate(70 145)" font-family="Inter,Segoe UI,sans-serif"><g><text x="0" y="0" fill="#eaf2ff" font-size="18" font-weight="650">SHARED PATH</text><rect x="0" y="30" width="600" height="245" rx="18" fill="#111c2c" stroke="#33455c"/><rect x="45" y="85" width="95" height="55" rx="8" fill="#65778d"/><rect x="45" y="155" width="95" height="55" rx="8" fill="#65778d"/><rect x="45" y="225" width="95" height="28" rx="8" fill="#65778d"/><path d="M155 170H520" stroke="#65adff" stroke-width="14" stroke-linecap="round"/><circle cx="320" cy="170" r="20" fill="#ff7b72"/><path d="M306 156l28 28m0-28l-28 28" stroke="#0b1220" stroke-width="6"/><text x="165" y="235" fill="#91a5bd" font-size="14">one blocked path can expose</text><text x="165" y="257" fill="#91a5bd" font-size="14">multiple retained payloads</text></g><g transform="translate(720)"><text x="0" y="0" fill="#eaf2ff" font-size="18" font-weight="650">INDEPENDENT RETAINED BAYS</text><rect x="0" y="30" width="600" height="245" rx="18" fill="#111c2c" stroke="#33455c"/><g stroke="#65adff" stroke-width="10" stroke-linecap="round"><path d="M155 85H520"/><path d="M155 150H520"/><path d="M155 215H520"/></g><g fill="#65778d"><rect x="45" y="60" width="95" height="50" rx="8"/><rect x="45" y="125" width="95" height="50" rx="8"/><rect x="45" y="190" width="95" height="50" rx="8"/></g><circle cx="320" cy="150" r="18" fill="#ff7b72"/><path d="M308 138l24 24m0-24l-24 24" stroke="#0b1220" stroke-width="5"/><text x="165" y="270" fill="#91a5bd" font-size="14">local path fault can be isolated, but shared</text><text x="165" y="292" fill="#91a5bd" font-size="14">power/control can still be common-mode</text></g></g></svg>