<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="t d">
<title id="t">VOLLEY programmable departure concept</title><desc id="d">A controlled orbital host releases several spacecraft with different relative departure conditions.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#101a2b"/></linearGradient><radialGradient id="earth"><stop stop-color="#2b78c5"/><stop offset=".72" stop-color="#12385f"/><stop offset="1" stop-color="#081525"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1600" height="720" rx="28" fill="url(#bg)"/>
<g opacity=".28" fill="#9cc8ff"><circle cx="90" cy="92" r="2"/><circle cx="220" cy="160" r="1.5"/><circle cx="410" cy="78" r="2"/><circle cx="690" cy="126" r="1"/><circle cx="890" cy="74" r="1.5"/><circle cx="1190" cy="145" r="2"/><circle cx="1480" cy="92" r="1.5"/><circle cx="1380" cy="320" r="1"/></g>
<circle cx="800" cy="870" r="430" fill="url(#earth)" stroke="#4ea5ff" stroke-opacity=".35" stroke-width="2"/>
<path d="M250 476 C520 260 1080 260 1350 476" fill="none" stroke="#6c7d91" stroke-width="3" stroke-dasharray="10 12"/>
<path d="M250 476 C520 226 1080 226 1350 476" fill="none" stroke="#3fd1c5" stroke-width="4" opacity=".9"/>
<path d="M250 476 C520 190 1080 190 1350 476" fill="none" stroke="#7fb4ff" stroke-width="4" opacity=".8"/>
<path d="M250 476 C520 300 1080 300 1350 476" fill="none" stroke="#f2b65c" stroke-width="4" opacity=".85"/>
<g transform="translate(785 286) rotate(-8)"><rect x="-58" y="-18" width="116" height="36" rx="8" fill="#dce8f7"/><rect x="-20" y="-42" width="40" height="84" rx="6" fill="#8095ad"/><path d="M-88 -8h30v16h-30zm146 0h30v16h-30z" fill="#4d78a8"/></g>
<g filter="url(#glow)"><circle cx="945" cy="250" r="8" fill="#3fd1c5"/><circle cx="1050" cy="220" r="8" fill="#7fb4ff"/><circle cx="930" cy="316" r="8" fill="#f2b65c"/></g>
<path d="M842 280 Q900 265 940 252" fill="none" stroke="#3fd1c5" stroke-width="3" marker-end="url(#a)"/><path d="M842 276 Q950 235 1044 221" fill="none" stroke="#7fb4ff" stroke-width="3"/><path d="M842 292 Q890 310 924 315" fill="none" stroke="#f2b65c" stroke-width="3"/>
<g font-family="Inter,Segoe UI,sans-serif" fill="#eaf2ff"><text x="90" y="92" font-size="28" font-weight="700" letter-spacing="2">PROGRAMMABLE DEPARTURE</text><text x="90" y="132" font-size="18" fill="#9eb0c5">same host · different release condition · different trajectory</text></g>
<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17"><rect x="1060" y="350" width="410" height="210" rx="18" fill="#0b1524" stroke="#273b55"/><text x="1100" y="398" fill="#9eb0c5">HOST PROVIDES</text><text x="1100" y="432" fill="#eaf2ff">orbital state · attitude · resources</text><text x="1100" y="478" fill="#9eb0c5">VOLLEY CONTROLS</text><text x="1100" y="512" fill="#eaf2ff">relative Δv · direction · timing</text><text x="1100" y="558" fill="#f2b65c">AFTER RELEASE</text><text x="1100" y="592" fill="#eaf2ff">spacecraft is on its own</text></g>
<g font-family="Inter,Segoe UI,sans-serif"><text x="90" y="610" font-size="46" font-weight="750" fill="#fff">The release is part of the mission.</text><text x="90" y="654" font-size="21" fill="#a9bad0">VOLLEY asks how much useful initial mobility can live outside the spacecraft.</text></g>
</svg>